<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background: Deep Tech Midnight Squircle -->
    <linearGradient id="tb-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080E1E" />
      <stop offset="100%" stop-color="#0F1D38" />
    </linearGradient>

    <!-- Border Ring: Subtle Electric Sky Glow -->
    <linearGradient id="tb-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.2" />
    </linearGradient>

    <!-- Monogram Gradient: Electric Cyan into Pure White -->
    <linearGradient id="tb-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tb-bg)" stroke="url(#tb-ring)" stroke-width="1.5" />

  <!-- TB Monogram -->
  <text
    x="32"
    y="42"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="33"
    font-weight="900"
    letter-spacing="-0.5"
    text-anchor="middle"
    fill="url(#tb-text-grad)"
  >TB</text>
</svg>

